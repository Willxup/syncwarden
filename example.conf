###############################################################################
# SyncWarden Public Example Configuration
# SyncWarden 公开示例配置
#
# This file uses reserved domains and fictitious values only; no real server,
# port, account, key path, source, destination, name, or schedule is included.
# 本文件只使用 RFC 保留域名和虚构参数，不包含任何真实服务器、端口、账号、
# 私钥路径、同步目录、目标目录、名称或运行时间。
#
# Usage:
# 使用方法：
#   1. Copy this file to syncwarden.conf.
#   1. 将本文件复制为 syncwarden.conf。
#   2. Replace every sample value.
#   2. 替换每一个示例值。
#   3. Never commit real syncwarden.conf files or share them with unrelated parties.
#   3. 不要把真实的 syncwarden.conf 提交到公开仓库或发送给无关人员。
###############################################################################

[global]

# Scheduled synchronization hours in the SyncWarden host's local timezone.
# 定时同步小时，使用运行 SyncWarden 主机的本地时区。
sync_hours=2,14

# Number of calendar months of managed logs to retain.
# 受管日志保留的自然月数量。
log_retention_months=6


[defaults]

# Include this server in --scheduled; manual runs by ID are unaffected.
# 是否参加 --scheduled；不影响按 ID 手动执行。
scheduled_sync_enabled=yes

# Default SSH port, account, and private key.
# 默认 SSH 端口、账号和私钥。
port=22
user=backup
key_file=/home/backup/.ssh/id_syncwarden_example

# rsync no-protocol-I/O timeout, retry count, and retry delays in seconds.
# rsync 连续无协议 I/O 超时、重试次数和重试等待秒数。
# SSH, archiving, capacity, and local maintenance use fixed script time limits.
# SSH、归档、容量和本地维护命令使用脚本内固定时限。
rsync_timeout_seconds=300
retry_count=1
retry_delays_seconds=60

# Owner of mirrors and new ZIP archives.
# 同步镜像和新 ZIP 归档使用的所有者。
owner=backup:backup

# ZIP archive retention policy.
# ZIP 归档保留策略。
archive_recent_keep=7
archive_monthly_keep=6

# Minimum free space and inodes on the destination filesystem.
# 目标文件系统最小可用空间和 inode 数量。
min_free_space_mb=1024
min_free_inodes=5000


###############################################################################
# Sample server 1: multiple sources.
# 示例服务器一：演示多个 source。
###############################################################################

[server:sample-primary]
host=source-one.example.net
name=Sample primary server
destination=/srv/syncwarden-sample/mirrors/sample-primary
source=/srv/example-application
source=/var/lib/example-database


###############################################################################
# Sample server 2: account overrides and disabled scheduled synchronization.
# 示例服务器二：演示账号覆盖和暂停定时同步。
###############################################################################

[server:sample-secondary]
host=source-two.example.org
name=Sample secondary server
scheduled_sync_enabled=no
port=22
user=archive
key_file=/home/archive/.ssh/id_syncwarden_sample
destination=/mnt/syncwarden-sample/sample-secondary
source=/srv/example-content
rsync_timeout_seconds=600
