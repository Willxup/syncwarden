[global]
sync_hours=3,15
log_retention_months=6

[defaults]
scheduled_sync_enabled=yes
port=22
user=backup
key_file=/home/backup/.ssh/id_syncwarden
rsync_timeout_seconds=300
retry_count=2
retry_delays_seconds=30,120
owner=nobody:nogroup
archive_recent_keep=7
archive_monthly_keep=6
min_free_space_mb=2048
min_free_inodes=10000

[server:sample-server]
host=source.example.net
name=Sample-Server
destination=/tmp/syncwarden-test-sample-server
source=/srv/example-data

[server:backup-node]
host=backup.example.com
name=Backup-Node
port=2222
destination=/tmp/syncwarden-test-backup-node
source=/srv/example-app
source=/var/lib/example-config
